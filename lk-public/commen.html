<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Панель оператора Omyvai</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Bootstrap CSS (если используете) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <!-- Ваши стили -->
    <link rel="stylesheet" href="assets/css/lk.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <!-- Firebase config -->
    <script src="assets/js/firebase-config.js" defer></script>
    
    <!-- Operator guard -->
    <script src="assets/js/operator-guard.js" defer></script>

</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="header-title" id="home-link">Панель оператора</div>
            <div class="header-tag">Деньги • Состояние • Остаток</div>
        </div>
        <div class="header-right">
            <div class="header-user">
                <span class="header-user-email">Загружается...</span>
                <span class="header-user-role">Оператор</span>
            </div>
            <button class="header-btn" id="logout-btn">Выйти</button>
        </div>
    </header>

    <main class="main"></main>

    <footer class="footer">
        <div class="footer-left">
            <span>Omyvai · панель оператора</span>
            <a class="footer-link" href="https://wiki.omyvai.local" target="_blank" rel="noreferrer">
                Вики
            </a>
        </div>
        <div class="footer-right">
            <a class="footer-link" href="mailto:support@omyvai.ru">
                Поддержка
            </a>
            <span>v0.1.0</span>
        </div>
    </footer>

    <!-- jQuery (обязательно до Bootstrap и ваших скриптов) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Основная логика: router + экраны -->
    <script type="module">
        import { initApp } from './assets/js/basic.js';
      
        document.addEventListener('operatorAuthorized', () => {
          initApp();
        });
      
        if (window.operatorGuard && window.operatorGuard.isAuthenticated) {
          initApp();
        }
    </script>
      
</body>
</html>
