<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Страница не найдена | Чистые Стёкла</title>
  <meta name="robots" content="noindex, nofollow">
  /x-icon" href="https://omyvai.ru/favicon.ico">
  /css/styles.css">
  <style>
    .page-404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg, #f8fafc);
    }

    .page-404-code {
      font-size: 7rem;
      font-weight: 800;
      line-height: 1;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-404-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 0.75rem 0;
      color: #1e293b;
    }

    .page-404-text {
      font-size: 1rem;
      color: #64748b;
      max-width: 400px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    .page-404-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .page-404-logo {
      margin-bottom: 2rem;
    }

    .page-404-logo img {
      height: 48px;
      width: auto;
    }

    .page-404-footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="page-inner">

    <div class="page-404">

      <div class="page-404-logo">
        <a href="/">
          <img src="images/LogoWithoutBackground.png" alt="Чистые Стёкла">
        </a>
      </div>

      <div class="page-404-code">404</div>
      <h1 class="page-404-title">Страница не найдена</h1>
      <p class="page-404-text">
        Такой страницы не существует или она была перемещена.
        Вернитесь на главную или найдите ближайший автомат на карте.
      </p>

      <div class="page-404-actions">
        <a href="/" class="btn btn-primary">На главную</a>
        <a href="/help.html" class="btn btn-secondary">Служба поддержки</a>
      </div>

      <div class="page-404-footer">
        © 2026 Чистые Стёкла — 24/7 сервис для водителей
      </div>

    </div>

  </div>
</div>
</body>
</html>
